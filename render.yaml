# Einrichtung für Render (render.com) – siehe README, Abschnitt „Online stellen mit Render“.
# Werte mit "sync: false" fragt Render beim Einrichten ab. Sie stehen nie hier in der Datei.
services:
  - type: web
    name: friseur-termine
    runtime: node
    region: frankfurt
    plan: starter # kleinstes Paket mit dauerhaftem Speicher (die kostenlose Variante löscht Daten)
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/info
    disk:
      name: daten
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TIMEZONE
        value: Europe/Berlin
      - key: DB_PATH
        value: /var/data/salon.db
      - key: ADMIN_PASSWORD # Passwort für deinen Bereich (/admin)
        sync: false
      - key: SMTP_HOST
        value: smtp.web.de
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER # deine web.de-Adresse
        sync: false
      - key: SMTP_PASS # Passwort des web.de-Postfachs
        sync: false
